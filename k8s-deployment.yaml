# Source: entertainment-express/templates/frappe-python.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-python
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: entertainment-express
      app.kubernetes.io/component: python
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: python
    spec:
      enableServiceLinks: false
      initContainers:
      - name: fix-sites-perms
        image: busybox:1.36
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /mnt/sites 2>/dev/null || true; chmod -R u+rwX,g+rwX /mnt/sites 2>/dev/null || true"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: seed-sites
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "if [ ! -f /mnt/sites/apps.txt ]; then cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true; fi"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        securityContext:
          runAsUser: 1000
        command: ["/bin/sh", "-c", "cp -f /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: python
              topologyKey: kubernetes.io/hostname
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
      containers:
      - name: frappe-python
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          set -e
          mkdir -p /home/frappe/logs
          cd /home/frappe/frappe-bench
          export SITES_PATH=/home/frappe/frappe-bench/sites
          # No nginx in this deployment, so gunicorn must serve the static /assets and
          # /files itself: frappe.app:application_with_statics() is a factory that wraps
          # the WSGI app with SharedDataMiddleware. Plain frappe.app:application 404s all
          # assets. After bumping the frappe/erpnext base image, flush redis-cache and
          # roll this deployment so the cached asset manifest matches the new bundles.
          exec /home/frappe/frappe-bench/env/bin/gunicorn \
            --chdir /home/frappe/frappe-bench/sites \
            --bind 0.0.0.0:8000 \
            --workers 4 \
            --worker-class gthread \
            --threads 4 \
            --worker-tmp-dir /dev/shm \
            --timeout 120 \
            --max-requests 5000 \
            --max-requests-jitter 500 \
            'frappe.app:application_with_statics()'
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/method/ping
            port: 8000
            httpHeaders:
            - name: Host
              value: base.app.entertainmentexpress.app
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/method/ping
            port: 8000
            httpHeaders:
            - name: Host
              value: base.app.entertainmentexpress.app
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: entertainment-express-sites
      - name: common-config
        configMap:
          name: entertainment-express-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json

