# Source: entertainment-express/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entertainment-express-ingress
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-https@kubernetescrd,traefik-gzip-compress@kubernetescrd,traefik-security-headers@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - "*.app.entertainmentexpress.app"
    - "admin.entertainmentexpress.app"
    # secretName omitted — the cert resolver manages the TLS secret automatically.
  rules:
  - host: "*.app.entertainmentexpress.app"
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: frappe-socketio
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frappe-python
            port:
              number: 8000
  - host: "admin.entertainmentexpress.app"
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: frappe-socketio
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frappe-python
            port:
              number: 8000
---
# Route the public prod domain (entx.app + www) to the control-plane site. Frappe
# multi-tenant resolves the site from the X-Frappe-Site-Name header, so Traefik injects
# it (standard pattern in this cluster — mirrors the frappe/frappe-site-header middleware).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: entx-site-header
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: middleware
spec:
  headers:
    customRequestHeaders:
      X-Frappe-Site-Name: admin.entertainmentexpress.app
---
# Public prod URL — entx.app (+ www) — control plane. TLS is terminated at Cloudflare's
# edge (Universal SSL covers the apex + first-level *.entx.app); Traefik serves the origin
# with its default cert over Cloudflare "Full". A proper origin Let's Encrypt cert for this
# zone needs DNS-01 (HTTP-01 can't validate the apex behind Cloudflare's Always-Use-HTTPS)
# with an entx.app-scoped Cloudflare API token — see the note in secrets.example.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entertainment-express-entx
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: entertainment-express-entx-site-header@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: entx.app
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: frappe-socketio
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frappe-python
            port:
              number: 8000
  - host: www.entx.app
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: frappe-socketio
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frappe-python
            port:
              number: 8000
---
# Tenant sites — <slug>.entx.app (multi-tenant; Frappe resolves each site from the Host,
# so no site-header middleware here — each tenant subdomain IS its own site directory).
# Public TLS for first-level *.entx.app is provided by Cloudflare's edge (Universal SSL);
# the origin is reached over Cloudflare "Full", so a per-tenant origin cert is not needed.
# (Let's Encrypt HTTP-01 cannot issue wildcard certs; switch to a DNS-01 issuer if the
# edge ever terminates directly on this cluster.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entertainment-express-tenants
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  ingressClassName: traefik
  rules:
  - host: "*.entx.app"
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: frappe-socketio
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frappe-python
            port:
              number: 8000
