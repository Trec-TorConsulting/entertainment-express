apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: entertainment-express
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: mariadb
    spec:
      affinity:
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
      containers:
      - name: mariadb
        image: mariadb:10.11.18
        imagePullPolicy: IfNotPresent
        args:
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
          - --skip-character-set-client-handshake
          - --max-connections=500
          - --innodb-buffer-pool-size=512M
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: mariadb-root-password
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: mariadb-user
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: mariadb-password
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD"'
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD"'
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: data
      annotations:
        numberOfReplicas: "2"
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: mariadb
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn
      resources:
        requests:
          storage: 30Gi

