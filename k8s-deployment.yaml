# ─────────────────────────────────────────────────────────────────────────────
# Entertainment Express — Production Kubernetes manifests
#
# Self-contained, kubectl-appliable deployment for the entertainment-express
# namespace. Built from this repo's Dockerfile image
# (192.168.4.10:30500/entertainment-express/bench:0.0.1).
#
# PREREQUISITES — create the two secrets first (never commit real secrets):
#   see secrets.example.yaml, then:
#   kubectl -n entertainment-express apply -f secrets.example.yaml   # after editing
#
# DEPLOY:
#   kubectl apply -f k8s-deployment.yaml
#
# NOTE: the site-init and admin-site-init Jobs are one-shot bootstrappers. They
# wait for MariaDB and are idempotent. To re-run them (e.g. after an image bump),
# delete first:  kubectl -n entertainment-express delete job entertainment-express-site-init entertainment-express-admin-site-init
#
# NOTE (existing clusters migrated from Helm): the live MariaDB StatefulSet was
# originally created by Helm, so its immutable volumeClaimTemplates still carry
# app.kubernetes.io/managed-by=Helm. A full re-apply will report the MariaDB
# StatefulSet as rejected ("updates to statefulset spec ... are forbidden"). This
# is harmless — MariaDB is already running and matches this manifest. On a fresh
# cluster the manifest applies cleanly.
# ─────────────────────────────────────────────────────────────────────────────
---
# Source: entertainment-express/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    # Isolated environment — no shared resources across dev/prod or with other apps.

---
# Source: entertainment-express/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: entertainment-express-common-config
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: config
data:
  common_site_config.json: |
    {
      "db_host": "mariadb",
      "redis_cache": "redis://redis-cache:6379",
      "redis_queue": "redis://redis-queue:6379",
      "redis_socketio": "redis://redis-socketio:6379",
      "socketio_host": "frappe-socketio",
      "socketio_port": 9000,
      "maintenance_mode": 0,
      "serve_default_site": 0,
      "auto_migrate": 1,
      "dns_multitenant": 1,
      "cookie_secure": 1,
      "cookie_samesite": "None",
      "server_script_enabled": 1,
      "ignore_csrf": 0,
      "allow_cors": [],
      "ee_base_domain": "entx.app",
      "ee_tenant_domain": "entx.app",
      "ee_focus_desk": 1
    }

---
# Source: entertainment-express/templates/pvc-sites.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: entertainment-express-sites
  namespace: entertainment-express
  annotations:
    numberOfReplicas: "2"
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: sites
spec:
  accessModes:
  - ReadWriteMany   # python + workers + scheduler + socketio all mount this
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi

