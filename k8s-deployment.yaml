apiVersion: batch/v1
kind: Job
metadata:
  name: entertainment-express-admin-site-init
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: admin-site-init
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: admin-site-init
    spec:
      restartPolicy: Never
      initContainers:
      - name: fix-sites-perms
        image: busybox:1.36
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /mnt/sites 2>/dev/null || true; chmod -R u+rwX,g+rwX /mnt/sites 2>/dev/null || true"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: seed-sites
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "if [ ! -f /mnt/sites/apps.txt ]; then cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true; fi"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        securityContext:
          runAsUser: 1000
        command: ["/bin/sh", "-c", "cp -f /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      affinity:
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
      containers:
      - name: admin-site-init
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          set -e
          ADMIN_SITE="admin.${BASE_DOMAIN}"
          cd /home/frappe/frappe-bench

          echo "Waiting for MariaDB..."
          for i in $(seq 1 60); do
            if mysqladmin ping -h mariadb -uroot -p"${DB_ROOT_PASSWORD}" --silent 2>/dev/null; then
              echo "MariaDB is ready."; break
            fi
            echo "  ...still waiting ($i/60)"; sleep 3
          done

          if [ -f "sites/${ADMIN_SITE}/site_config.json" ]; then
            echo "Admin site ${ADMIN_SITE} already provisioned — skipping creation."
          else
            echo "Creating control-plane site ${ADMIN_SITE}..."
            rm -rf "sites/${ADMIN_SITE}"
            bench new-site "${ADMIN_SITE}" \
              --force \
              --db-host mariadb \
              --db-root-username root \
              --mariadb-root-password "${DB_ROOT_PASSWORD}" \
              --admin-password "${ADMIN_PASSWORD}" \
              --no-mariadb-socket
          fi

          bench --site "${ADMIN_SITE}" install-app erpnext || true
          bench --site "${ADMIN_SITE}" install-app entertainment_express || true
          bench --site "${ADMIN_SITE}" migrate
          bench --site "${ADMIN_SITE}" set-config host_name "https://${ADMIN_SITE}"
          bench --site "${ADMIN_SITE}" execute \
            entertainment_express.setup.seed_plans.run || true
          echo "Admin site init complete."
        env:
        - name: BASE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: base-domain
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: mariadb-root-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: administrator-password
        - name: EE_STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ee-stripe-secrets
              key: stripe-secret-key
        - name: EE_STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ee-stripe-secrets
              key: stripe-webhook-secret
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:   { cpu: "2", memory: 2Gi }
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: entertainment-express-sites
      - name: common-config
        configMap:
          name: entertainment-express-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json

---
# Source: entertainment-express/templates/site-init-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: entertainment-express-site-init
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: site-init
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: site-init
    spec:
      restartPolicy: Never
      initContainers:
      - name: fix-sites-perms
        image: busybox:1.36
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /mnt/sites 2>/dev/null || true; chmod -R u+rwX,g+rwX /mnt/sites 2>/dev/null || true"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: seed-sites
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "if [ ! -f /mnt/sites/apps.txt ]; then cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true; fi"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        securityContext:
          runAsUser: 1000
        command: ["/bin/sh", "-c", "cp -f /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      affinity:
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
      containers:
      - name: site-init
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          set -e
          SITE="base.app.${BASE_DOMAIN}"
          cd /home/frappe/frappe-bench

          echo "Waiting for MariaDB..."
          for i in $(seq 1 60); do
            if mysqladmin ping -h mariadb -uroot -p"${DB_ROOT_PASSWORD}" --silent 2>/dev/null; then
              echo "MariaDB is ready."; break
            fi
            echo "  ...still waiting ($i/60)"; sleep 3
          done

          if [ -f "sites/${SITE}/site_config.json" ]; then
            echo "Site ${SITE} already provisioned — skipping creation."
          else
            echo "Creating site ${SITE}..."
            rm -rf "sites/${SITE}"
            bench new-site "${SITE}" \
              --force \
              --db-host mariadb \
              --db-root-username root \
              --mariadb-root-password "${DB_ROOT_PASSWORD}" \
              --admin-password "${ADMIN_PASSWORD}" \
              --no-mariadb-socket
          fi

          echo "Installing erpnext..."
          bench --site "${SITE}" install-app erpnext || true
          echo "Installing entertainment_express..."
          bench --site "${SITE}" install-app entertainment_express
          echo "Running migrate..."
          bench --site "${SITE}" migrate
          echo "Setting host name..."
          bench --site "${SITE}" set-config host_name "https://${SITE}"
          echo "Site init complete."
        env:
        - name: BASE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: base-domain
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: mariadb-root-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ee-secrets
              key: administrator-password
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:   { cpu: "2", memory: 2Gi }
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: entertainment-express-sites
      - name: common-config
        configMap:
          name: entertainment-express-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json

