apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-worker-long
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: worker-long
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: entertainment-express
      app.kubernetes.io/component: worker-long
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entertainment-express
        app.kubernetes.io/instance: ee-prod
        app.kubernetes.io/managed-by: kubectl
        helm.sh/chart: entertainment-express-0.1.0
        app.kubernetes.io/component: worker-long
    spec:
      enableServiceLinks: false
      initContainers:
      - name: fix-sites-perms
        image: busybox:1.36
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /mnt/sites 2>/dev/null || true; chmod -R u+rwX,g+rwX /mnt/sites 2>/dev/null || true"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: seed-sites
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "if [ ! -f /mnt/sites/apps.txt ]; then cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true; fi"]
        volumeMounts:
        - name: sites
          mountPath: /mnt/sites
      - name: write-common-config
        image: busybox:1.36
        securityContext:
          runAsUser: 1000
        command: ["/bin/sh", "-c", "cp -f /config/common_site_config.json /mnt/sites/common_site_config.json"]
        volumeMounts:
        - name: common-config
          mountPath: /config
        - name: sites
          mountPath: /mnt/sites
      affinity:
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - node05
      containers:
      - name: worker
        image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
        imagePullPolicy: Always
        command: ["bash", "-c", "mkdir -p /home/frappe/logs && cd /home/frappe/frappe-bench && bench worker --queue long"]
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 200m
            memory: 512Mi
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: entertainment-express-sites
      - name: common-config
        configMap:
          name: entertainment-express-common-config
          items:
          - key: common_site_config.json
            path: common_site_config.json
