apiVersion: batch/v1
kind: CronJob
metadata:
  name: entertainment-express-backup
  namespace: entertainment-express
  labels:
    app.kubernetes.io/name: entertainment-express
    app.kubernetes.io/instance: ee-prod
    app.kubernetes.io/managed-by: kubectl
    helm.sh/chart: entertainment-express-0.1.0
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: entertainment-express
            app.kubernetes.io/instance: ee-prod
            app.kubernetes.io/managed-by: kubectl
            helm.sh/chart: entertainment-express-0.1.0
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          affinity:
            
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - node05
          initContainers:
          - name: fix-sites-perms
            image: busybox:1.36
            command: ["/bin/sh", "-c", "chown -R 1000:1000 /mnt/sites 2>/dev/null || true; chmod -R u+rwX,g+rwX /mnt/sites 2>/dev/null || true"]
            securityContext:
              runAsUser: 0
            volumeMounts:
            - name: sites
              mountPath: /mnt/sites
          - name: seed-sites
            image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "if [ ! -f /mnt/sites/apps.txt ]; then cp -a /home/frappe/frappe-bench/sites/. /mnt/sites/ || true; fi"]
            volumeMounts:
            - name: sites
              mountPath: /mnt/sites
          - name: write-common-config
            image: busybox:1.36
            securityContext:
              runAsUser: 1000
            command: ["/bin/sh", "-c", "cp -f /config/common_site_config.json /mnt/sites/common_site_config.json"]
            volumeMounts:
            - name: common-config
              mountPath: /config
            - name: sites
              mountPath: /mnt/sites
          containers:
          - name: bench-backup
            image: 192.168.4.10:30500/entertainment-express/bench:0.0.1
            imagePullPolicy: Always
            command:
            - bash
            - -c
            - |
              set -e
              cd /home/frappe/frappe-bench
              echo "=== EE Backup starting at $(date) ==="
              bench --site all backup --with-files --backup-path /tmp/ee-backups
              echo "=== Backup files written ==="; ls -lh /tmp/ee-backups/
            volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: backup-staging
              mountPath: /tmp/ee-backups
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits:   { cpu: "1", memory: 1Gi }
          - name: upload-to-minio
            image: minio/mc:latest
            command:
            - /bin/sh
            - -c
            - |
              set -e
              DATE=$(date +%Y-%m-%d)
              mc alias set backup "http://192.168.4.9:9000" \
                "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
              mc mb --ignore-existing backup/ee-backups
              echo "Uploading backup for ${DATE}..."
              mc cp --recursive /tmp/ee-backups/ "backup/ee-backups/${DATE}/"
              echo "Pruning backups older than 30 days..."
              mc find backup/ee-backups --older-than 30d --exec "mc rm {}" || true
              echo "=== Backup complete at $(date) ==="
            env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ee-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ee-secrets
                  key: minio-secret-key
            volumeMounts:
            - name: backup-staging
              mountPath: /tmp/ee-backups
              readOnly: true
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits:   { cpu: 500m, memory: 256Mi }
          volumes:
          - name: sites
            persistentVolumeClaim:
              claimName: entertainment-express-sites
          - name: common-config
            configMap:
              name: entertainment-express-common-config
              items:
              - key: common_site_config.json
                path: common_site_config.json
          - name: backup-staging
            emptyDir: {}

