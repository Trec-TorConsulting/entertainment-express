name: Crew App EAS Preview

# Builds internal iOS/Android artifacts for QA when secrets are configured.
# Required secrets: EXPO_TOKEN
# Optional: EXPO_APPLE_ID, EXPO_ASC_APP_ID, EXPO_APPLE_TEAM_ID (for submit)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
          - development
  push:
    paths:
      - "frontend/crew-app/**"
      - ".github/workflows/crew-app-eas.yml"
    branches:
      - main

jobs:
  eas-build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} (${{ github.event.inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/crew-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/crew-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Skip if EXPO_TOKEN missing
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret not set — skipping remote build (config validated locally)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS build
        if: steps.gate.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive
