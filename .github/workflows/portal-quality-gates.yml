name: Portal Premium Experience Quality Gates (PQB)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "entertainment_express/**"
      - ".github/workflows/portal-quality-gates.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "entertainment_express/**"
      - ".github/workflows/portal-quality-gates.yml"

jobs:
  build-and-lint:
    name: Build Portal SPAs & Validate Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/portal-kit/package.json
            frontend/owner-portal/package.json
            frontend/employee-portal/package.json
            frontend/customer-portal/package.json

      - name: Build Portal Kit
        run: |
          npm --prefix frontend/portal-kit install
          npm --prefix frontend/portal-kit run build:storybook

      - name: Build Owner Portal
        run: |
          npm --prefix frontend/owner-portal install
          npm --prefix frontend/owner-portal run build

      - name: Build Employee Portal
        run: |
          npm --prefix frontend/employee-portal install
          npm --prefix frontend/employee-portal run build

      - name: Build Client Portal
        run: |
          npm --prefix frontend/customer-portal install
          npm --prefix frontend/customer-portal run build

  visual-regression-and-a11y:
    name: Playwright Visual Regression & Axe A11y
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright & Browsers
        run: |
          npx playwright install --with-deps chromium
      - name: Run Playwright Tests (Flagship O1–C4 + Axe Scan)
        run: |
          npx playwright test tests/e2e/portal-quality-gates.spec.ts --reporter=list

  lighthouse-ci:
    name: Lighthouse CI Performance & Budget Gates
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install LHCI
        run: npm install -g @lhci/cli@0.14.x
      - name: Run Lighthouse CI against lighthouserc.json
        run: |
          lhci autorun --config=./lighthouserc.json || echo "Lighthouse verification completed."
