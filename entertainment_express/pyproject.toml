[project]
name = "entertainment_express"
authors = [
    { name = "Trec-Tor Consulting", email = "tobey@trec-tor.com" }
]
description = "Multi-tenant SaaS ERP/CRM for mobile entertainment companies"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
license = { text = "Proprietary" }
dependencies = [
    "frappe",
    "erpnext",
]

[build-system]
requires = ["flit_core >=3.4.0,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "entertainment_express"

[tool.black]
line-length = 99
