<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ spa_title or "Your events" }}</title>
  {% if spa_favicon %}<link rel="icon" href="{{ spa_favicon }}">{% endif %}
  <link rel="stylesheet" href="{{ spa_css or "/assets/entertainment_express/client/assets/main.css" }}">
  <style>
    html, body, #root { margin: 0; min-height: 100vh; background: #f3f4f6; color: #0f172a; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ee-portal-footer { text-align: center; padding: 1.5rem 1rem; font-size: 0.875rem; color: #64748b; }
    .ee-portal-footer a { color: inherit; text-decoration: none; }
    .ee-portal-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root" data-portal="client"></div>
  {% if (portal_bootstrap and portal_bootstrap.get('show_ee_badge')) or show_ee_badge %}
  <footer class="ee-portal-footer" id="ee-client-footer">
    <a href="https://www.{{ base_domain or (portal_bootstrap and portal_bootstrap.get('base_domain')) or 'entx.app' }}" target="_blank" rel="noopener">Powered by Entertainment Express</a>
  </footer>
  {% endif %}
  <script>
    window.eePortalBootstrap = {{ portal_bootstrap | tojson }};
  </script>
  <script type="module" src="{{ spa_js or "/assets/entertainment_express/client/main.js" }}"></script>
</body>
</html>
