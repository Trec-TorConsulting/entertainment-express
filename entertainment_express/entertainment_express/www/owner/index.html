<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ spa_title or "Your company" }}</title>
  <meta name="theme-color" content="{{ (portal_bootstrap and portal_bootstrap.branding and portal_bootstrap.branding.color) or '#6d28d9' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ spa_favicon or "/assets/entertainment_express/images/entertainment-express-favicon.svg" }}">
  <link rel="stylesheet" href="{{ spa_css or "/assets/entertainment_express/owner/assets/main.css" }}">
  <style>
    :root {
      {% if portal_bootstrap and portal_bootstrap.branding and portal_bootstrap.branding.color %}
      --ee-brand: {{ portal_bootstrap.branding.color }};
      {% endif %}
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body, #root {
      margin: 0;
      min-height: 100vh;
      background: var(--ee-bg, #0b0f19);
      color: var(--ee-text, #f8fafc);
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root" data-portal="owner"></div>
  <script>
    window.eePortalBootstrap = {{ portal_bootstrap | tojson }};
  </script>
  <script type="module" src="{{ spa_js or "/assets/entertainment_express/owner/main.js" }}"></script>
</body>
</html>
