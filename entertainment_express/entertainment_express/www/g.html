{% extends "templates/web.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_content %}
<div style="max-width:56rem;margin:2rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;color:var(--ee-text,#0f172a)">
  <h1 style="margin:0 0 1rem;color:var(--ee-text,#0f172a)">{{ gallery.title }}</h1>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:0.75rem">
    {% for item in gallery.items or [] %}
      <figure style="margin:0;background:var(--ee-panel,#f5f5f4);border:1px solid var(--ee-border,#e5e7eb);border-radius:8px;overflow:hidden">
        {% if item.content_b64 and (item.mime or '').startswith('image/') %}
          <img src="data:{{ item.mime }};base64,{{ item.content_b64 }}" alt="{{ item.title }}" style="width:100%;display:block"/>
        {% else %}
          <figcaption style="padding:0.75rem;color:var(--ee-text,#0f172a)">{{ item.title }}</figcaption>
        {% endif %}
      </figure>
    {% endfor %}
  </div>
  {% if not gallery.items %}
    <p style="color:var(--ee-muted,#78716c)">No photos yet.</p>
  {% endif %}
</div>
{% endblock %}
