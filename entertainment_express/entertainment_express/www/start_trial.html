{% extends "entertainment_express/templates/marketing/base.html" %}

{% block marketing_content %}
<section class="ee-shell ee-panel">
  <h1>Start Your Free Trial</h1>
  <p>Choose your plan and launch your workspace at <strong>your-company.{{ tenant_domain }}</strong>.</p>

  <div id="trial-success" class="ee-form-status ee-success-panel" hidden aria-live="polite"></div>
  <div id="trial-status" class="ee-form-status" aria-live="polite"></div>

  <form class="ee-form" id="ee-trial-form">
    <label for="trial-company">Company Name</label>
    <input id="trial-company" name="company_name" type="text" maxlength="200" required>

    <label for="trial-email">Email</label>
    <input id="trial-email" name="contact_email" type="email" maxlength="140" required>

    <label for="trial-slug">Your workspace address</label>
    <div class="ee-slug-field">
      <input id="trial-slug" name="requested_slug" type="text" pattern="[a-z0-9][a-z0-9\-]{1,48}[a-z0-9]" required maxlength="50" placeholder="your-company" autocomplete="off">
      <span class="ee-slug-suffix">.{{ tenant_domain }}</span>
    </div>
    <p class="ee-slug-preview">You will get: <strong id="trial-slug-preview">https://your-company.{{ tenant_domain }}</strong></p>

    <label for="trial-plan">Plan</label>
    <input id="trial-plan" name="plan_code" type="text" value="{{ plan }}" readonly>

    <input type="hidden" name="source_page" value="/start-trial">
    <input type="hidden" name="utm_source" value="">
    <input type="hidden" name="utm_medium" value="">
    <input type="hidden" name="utm_campaign" value="">
    <input type="hidden" name="utm_term" value="">
    <input type="hidden" name="utm_content" value="">
    <input type="hidden" name="referrer" value="">
    <input type="text" name="website" value="" class="ee-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

    <label class="ee-consent-check">
      <input type="checkbox" name="consent_marketing" value="1">
      I agree to receive product updates.
    </label>

    <button type="submit" class="ee-btn ee-btn-primary">Continue to checkout</button>
  </form>
</section>

<script>
(function () {
  var tenantDomain = {{ tenant_domain | tojson }};
  var params = new URLSearchParams(window.location.search);
  var successPanel = document.getElementById("trial-success");
  var status = document.getElementById("trial-status");
  var form = document.getElementById("ee-trial-form");
  var companyInput = document.getElementById("trial-company");
  var slugInput = document.getElementById("trial-slug");
  var slugPreview = document.getElementById("trial-slug-preview");
  var submitBtn = form ? form.querySelector("button[type='submit']") : null;
  var slugUserEdited = false;

  function slugify(text) {
    return (text || "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9\-]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 50);
  }

  function workspaceUrl(slug) {
    var clean = slugify(slug) || "your-company";
    return "https://" + clean + "." + tenantDomain;
  }

  function updatePreview() {
    if (slugPreview && slugInput) {
      slugPreview.textContent = workspaceUrl(slugInput.value);
    }
  }

  function showError(msg) {
    if (!status) return;
    status.style.display = "block";
    status.style.color = "#dc2626";
    status.style.background = "#fee2e2";
    status.style.border = "1px solid #fca5a5";
    status.style.padding = "0.75rem 1rem";
    status.style.borderRadius = "0.375rem";
    status.style.marginTop = "1rem";
    status.style.fontWeight = "500";
    status.textContent = msg || "Unable to submit application. Please try again.";
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue to checkout";
    }
  }

  function showInfo(msg) {
    if (!status) return;
    status.style.display = "block";
    status.style.color = "#1e293b";
    status.style.background = "#f1f5f9";
    status.style.border = "1px solid #cbd5e1";
    status.style.padding = "0.75rem 1rem";
    status.style.borderRadius = "0.375rem";
    status.style.marginTop = "1rem";
    status.textContent = msg;
  }

  if (params.get("success") === "1") {
    var slug = params.get("slug") || "";
    var siteUrl = workspaceUrl(slug);
    if (successPanel) {
      successPanel.hidden = false;
      successPanel.innerHTML =
        "<h2>Payment received — we're building your workspace</h2>" +
        "<p>Your site will be ready at <a href='" + siteUrl + "'><strong>" + siteUrl + "</strong></a> " +
        "within a few minutes. Watch your inbox for a welcome email with a link to set your password.</p>";
    }
    if (form) {
      form.style.display = "none";
    }
    return;
  }

  if (params.get("canceled") === "1" && status) {
    showError("Checkout was canceled. You can try again when you're ready.");
  }

  if (!form || !slugInput) {
    return;
  }

  if (companyInput) {
    companyInput.addEventListener("input", function() {
      if (status) status.style.display = "none";
      if (!slugUserEdited || !slugInput.value.trim()) {
        slugInput.value = slugify(companyInput.value);
        updatePreview();
      }
    });
  }

  slugInput.addEventListener("input", function() {
    slugUserEdited = true;
    if (status) status.style.display = "none";
    var raw = slugInput.value;
    var sanitized = raw.toLowerCase().replace(/[^a-z0-9\-]/g, "-").replace(/-{2,}/g, "-");
    if (raw !== sanitized) {
      slugInput.value = sanitized;
    }
    updatePreview();
  });

  slugInput.addEventListener("blur", function() {
    slugInput.value = slugify(slugInput.value);
    updatePreview();
  });

  updatePreview();

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    var cleanSlug = slugify(slugInput.value);
    slugInput.value = cleanSlug;
    updatePreview();

    if (!cleanSlug || cleanSlug.length < 3) {
      showError("Please enter a workspace address with at least 3 letters or numbers.");
      slugInput.focus();
      return;
    }

    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = "Setting up your workspace...";
    }
    showInfo("Submitting...");

    var data = Object.fromEntries(new FormData(form).entries());
    data.requested_slug = cleanSlug;

    try {
      var res = await frappe.call({
        method: "entertainment_express.api.marketing.start_trial",
        args: { payload: data },
        error: function(r) {
          var msg = (r && r._server_messages) ? (JSON.parse(r._server_messages)[0] || "") : "";
          if (msg) {
            try { msg = JSON.parse(msg).message || msg; } catch(e){}
          }
          showError(msg || "Workspace address is already taken or invalid. Please try another address.");
        }
      });
      var message = res.message || {};
      if (message.ok === false || message.error) {
        showError(message.error || "Unable to submit application. Please try again.");
        return;
      }
      if (message.checkout_url) {
        showInfo("Redirecting to secure checkout...");
        if (typeof window.eeTrackConversion === "function") {
          window.eeTrackConversion("trial_started");
        }
        window.location.href = message.checkout_url;
        return;
      }
      if (message.manual_review) {
        showInfo((message.message || "Application submitted.") +
          " Your workspace will be " + (message.site_url || workspaceUrl(cleanSlug)) + ".");
      } else {
        showInfo("Application submitted! Your workspace will be " + (message.site_url || workspaceUrl(cleanSlug)) + ".");
      }
      if (typeof window.eeTrackConversion === "function") {
        window.eeTrackConversion("trial_started");
      }
      form.reset();
      updatePreview();
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue to checkout";
      }
    } catch (err) {
      showError(err.message || "Unable to submit application. Please try again.");
    }
  });
})();
</script>
{% endblock %}
