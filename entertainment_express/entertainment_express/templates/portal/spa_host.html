<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ spa_title }}</title>
  {% if spa_favicon %}<link rel="icon" href="{{ spa_favicon }}">{% endif %}
  <link rel="stylesheet" href="{{ spa_css }}">
  <style>
    html, body, #root { margin: 0; min-height: 100vh; background: #f3f4f6; color: #0f172a; font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root" data-portal="{{ spa_portal }}">Loading {{ spa_title | lower }}…</div>
  <script>
    window.eePortalBootstrap = {{ portal_bootstrap | tojson }};
  </script>
  <script type="module" src="{{ spa_js }}"></script>
</body>
</html>
