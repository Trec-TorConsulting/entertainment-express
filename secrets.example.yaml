# ─────────────────────────────────────────────────────────────────────────────
# Entertainment Express — secrets template  (namespace: entertainment-express)
#
# DO NOT COMMIT REAL SECRETS. Copy the values below, replace every REPLACE_ME,
# then apply. Generate strong random values, e.g.:
#   openssl rand -hex 24   # mariadb passwords
#   openssl rand -hex 16   # admin password, encryption key
#
#   kubectl create namespace entertainment-express --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n entertainment-express apply -f secrets.example.yaml   # after editing
#
# base-domain MUST match the ingress hosts in k8s-deployment.yaml
# (entertainmentexpress.app).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ee-secrets
  namespace: entertainment-express
type: Opaque
stringData:
  mariadb-root-password: "REPLACE_ME"
  mariadb-user: "ee_bench"
  mariadb-password: "REPLACE_ME"
  administrator-password: "REPLACE_ME"
  encryption-key: "REPLACE_ME"
  base-domain: "entertainmentexpress.app"
  smtp-password: "REPLACE_ME"
  minio-access-key: "REPLACE_ME"
  minio-secret-key: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: ee-stripe-secrets
  namespace: entertainment-express
type: Opaque
stringData:
  stripe-secret-key: "sk_live_REPLACE_ME"
  stripe-webhook-secret: "whsec_REPLACE_ME"
