# ─────────────────────────────────────────────────────────────────────────────
# Entertainment Express — secrets template  (namespace: entertainment-express)
#
# DO NOT COMMIT REAL SECRETS. Copy the values below, replace every REPLACE_ME,
# then apply. Generate strong random values, e.g.:
#   openssl rand -hex 24   # mariadb passwords
#   openssl rand -hex 16   # admin password, encryption key
#
#   kubectl create namespace entertainment-express --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n entertainment-express apply -f secrets.example.yaml   # after editing
#
# base-domain MUST match the ingress hosts in k8s-deployment.yaml
# (entx.app for prod). The control plane is served at this apex; tenants at <slug>.entx.app.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ee-secrets
  namespace: entertainment-express
type: Opaque
stringData:
  mariadb-root-password: "REPLACE_ME"
  mariadb-user: "ee_bench"
  mariadb-password: "REPLACE_ME"
  administrator-password: "REPLACE_ME"
  encryption-key: "REPLACE_ME"
  base-domain: "entertainmentexpress.app"
  smtp-password: "REPLACE_ME"
  minio-access-key: "REPLACE_ME"
  minio-secret-key: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: ee-stripe-secrets
  namespace: entertainment-express
type: Opaque
stringData:
  stripe-secret-key: "sk_live_REPLACE_ME"
  stripe-webhook-secret: "whsec_REPLACE_ME"
# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL — origin TLS certificate for entx.app
#
# entx.app sits behind Cloudflare, which terminates public TLS at its edge, so the
# app is already HTTPS. If you want a real Let's Encrypt cert on the ORIGIN too
# (Cloudflare "Full (strict)"), use a DNS-01 issuer — HTTP-01 cannot validate the
# apex behind Cloudflare's Always-Use-HTTPS, and cannot issue the *.entx.app wildcard.
#
# Prereq: a Cloudflare API token with Zone.DNS:Edit + Zone.Read on the entx.app zone.
#   kubectl -n entertainment-express create secret generic cloudflare-api-token \
#     --from-literal=api-token='REPLACE_ME'
# Then create a DNS-01 Issuer (ACME, solver dns01.cloudflare, key api-token) and a
# Certificate for [entx.app, "*.entx.app"] -> secret entx-app-tls, and reference that
# secret from the entertainment-express-entx / -tenants Ingress tls blocks.
# ─────────────────────────────────────────────────────────────────────────────
